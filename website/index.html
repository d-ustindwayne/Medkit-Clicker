<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Medkit Clicker</title>
    <meta name="description" content="A cosy pixel-art idle game about running a hospital. Tap the medkit, heal patients, and grow a little clinic into a grand medical center." />
    <meta name="theme-color" content="#dd1122" />
    <link rel="icon" type="image/png" href="/favicon.png" />
    <script>
      // Set the theme before first paint so dark-mode visitors never see a light flash.
      try {
        var t = localStorage.getItem("mc-theme");
        if (t !== "light" && t !== "dark") t = matchMedia("(prefers-color-scheme: dark)").matches ? "dark" : "light";
        document.documentElement.dataset.theme = t;
      } catch (e) {
        document.documentElement.dataset.theme = "light";
      }
    </script>
  </head>
  <body>
    <div id="app"></div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
