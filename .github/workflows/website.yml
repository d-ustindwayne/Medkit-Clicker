name: Deploy website to GitHub Pages

# Builds only website/ and publishes its dist/ folder; nothing else in the repo is served.
# Every push to main redeploys the site (it takes about a minute), and it can be run by hand from
# the Actions tab (Run workflow).
on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: website
    steps:
      - uses: actions/checkout@v5
      - uses: oven-sh/setup-bun@v2
      - run: bun install --frozen-lockfile
      # Pages serves the site at /<repo-name>/, so the build uses that as its base.
      - run: bun run build
        env:
          BASE_PATH: /${{ github.event.repository.name }}/
      # Deep links like /docs fall back to the app, which routes them.
      - run: cp dist/index.html dist/404.html
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: website/dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
