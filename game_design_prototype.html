    <audio autoplay id="audio-player">
      <source src="Sounds/Music/Cup Of Joe/Track 1.mp3" />
    </audio>
    <audio preload="auto" id="sfx-player"></audio>

    <div id="warning-container">
      <i class="bi bi-exclamation-triangle-fill h1 text-danger"></i>
      <p id="warning-message">
        Please run this on a desktop or resize the window in an appropriate
        size. Thank you, love you.
      </p>
    </div>

    <div class="container-fluid user-select-none font-inter-bold vh-100">
      <div class="row h-100">
        <div
          class="col-9 d-flex flex-column align-items-center h-100"
          id="clicker-container"
        >
          <h1 class="h1" id="clicker-count">0 Patients Healed</h1>
          <h3 class="h4" id="clicker-rate">0 Medkits per second</h3>
          <button
            type="button"
            class="btn ratio ratio-1x1 w-25 rounded rounded-circle border border-5 border-black"
            id="clicker-button"
          >
            <img
              src="Images/Medkit.png"
              alt=""
              class="w-100 ratio ratio-1x1 object-fit-contain mt-2"
            />
          </button>
        </div>

        <div class="col-3 h-100" id="aside-bar">
          <div class="row d-flex flex-column text-center">
            <div id="shop" class="col-8 h-100 w-100 overflow-y-scroll">
              <h3 class="h1 font-silkscreen">Shop</h3>

              <div
                class="shop-item card rounded-0 border border-black border-3 mb-2 c-pointer"
              >
                <div class="row py-1 px-2 align-items-center">
                  <div class="col-3">
                    <img src="Images/Syringe.png" alt="..." class="item-icon" />
                  </div>
                  <div class="col-8 text-start">
                    <p class="item-name h4 font-silkscreen mb-0">Syringe</p>
                    <span class="font-mallanna"
                      ><img
                        src="Images/Medkit.png"
                        alt="+"
                        class="medkit-currency me-1"
                      /><span id="syringe-price">24</span></span
                    >
                  </div>
                  <div class="col-1 text-start p-0 h-100">
                    <p
                      class="item-level font-mallanna mb-0 me-2 position-absolute bottom-0 end-0"
                      id="syringe-level"
                    >
                      0
                    </p>
                  </div>
                </div>
              </div>

              <div
                class="shop-item card rounded-0 border border-black border-3 mb-2 c-pointer"
              >
                <div class="row py-1 px-2 align-items-center">
                  <div class="col-3">
                    <img
                      src="Images/Stethoscope.png"
                      alt="..."
                      class="item-icon"
                    />
                  </div>
                  <div class="col-8 text-start">
                    <p class="item-name h4 font-silkscreen mb-0">Stethoscope</p>
                    <span class="font-mallanna"
                      ><img
                        src="Images/Medkit.png"
                        alt="+"
                        class="medkit-currency me-1"
                      /><span id="stethoscope-price">24</span></span
                    >
                  </div>
                  <div class="col-1 text-start p-0 h-100">
                    <p
                      class="item-level font-mallanna mb-0 me-2 position-absolute bottom-0 end-0"
                      id="stethoscope-level"
                    >
                      0
                    </p>
                  </div>
                </div>
              </div>

              <div
                class="shop-item card rounded-0 border border-black border-3 mb-2 c-pointer"
              >
                <div class="row py-1 px-2 align-items-center">
                  <div class="col-3">
                    <img
                      src="Images/Facemask.png"
                      alt="..."
                      class="item-icon"
                    />
                  </div>
                  <div class="col-8 text-start">
                    <p class="item-name h4 font-silkscreen mb-0">Facemask</p>
                    <span class="font-mallanna"
                      ><img
                        src="Images/Medkit.png"
                        alt="+"
                        class="medkit-currency me-1"
                      /><span id="facemask-price">24</span></span
                    >
                  </div>
                  <div class="col-1 text-start p-0 h-100">
                    <p
                      class="item-level font-mallanna mb-0 me-2 position-absolute bottom-0 end-0"
                      id="facemask-level"
                    >
                      0
                    </p>
                  </div>
                </div>
              </div>

              <div
                class="shop-item card rounded-0 border border-black border-3 mb-2 c-pointer"
              >
                <div class="row py-1 px-2 align-items-center">
                  <div class="col-3">
                    <img src="Images/Gloves.png" alt="..." class="item-icon" />
                  </div>
                  <div class="col-8 text-start">
                    <p class="item-name h4 font-silkscreen mb-0">Gloves</p>
                    <span class="font-mallanna"
                      ><img
                        src="Images/Medkit.png"
                        alt="+"
                        class="medkit-currency me-1"
                      /><span id="gloves-price">24</span></span
                    >
                  </div>
                  <div class="col-1 text-start p-0 h-100">
                    <p
                      class="item-level font-mallanna mb-0 me-2 position-absolute bottom-0 end-0"
                      id="gloves-level"
                    >
                      0
                    </p>
                  </div>
                </div>
              </div>

              <div
                class="shop-item card rounded-0 border border-black border-3 mb-2 c-pointer"
              >
                <div class="row py-1 px-2 align-items-center">
                  <div class="col-3">
                    <img
                      src="Images/Medicines.png"
                      alt="..."
                      class="item-icon"
                    />
                  </div>
                  <div class="col-8 text-start">
                    <p class="item-name h4 font-silkscreen mb-0">Medicines</p>
                    <span class="font-mallanna"
                      ><img
                        src="Images/Medkit.png"
                        alt="+"
                        class="medkit-currency me-1"
                      /><span id="medicine-price">24</span></span
                    >
                  </div>
                  <div class="col-1 text-start p-0 h-100">
                    <p
                      class="item-level font-mallanna mb-0 me-2 position-absolute bottom-0 end-0"
                      id="medicine-level"
                    >
                      0
                    </p>
                  </div>
                </div>
              </div>
            </div>
            <div id="settings" class="col-4 h-100 w-100">
              <table class="table">
                <thead>
                  <tr>
                    <td colspan="2">
                      <h3 class="h1 font-silkscreen">Settings</h3>
                    </td>
                  </tr>
                </thead>

                <tbody>
                  <tr>
                    <td>
                      <button type="button" class="btn btn-primary w-100">
                        Mode
                      </button>
                    </td>
                    <td>
                      <button type="button" class="btn btn-primary w-100">
                        Mode
                      </button>
                    </td>
                  </tr>
                  <tr>
                    <td>
                      <button type="button" class="btn btn-primary w-100">
                        Mode
                      </button>
                    </td>
                    <td>
                      <button type="button" class="btn btn-primary w-100">
                        Mode
                      </button>
                    </td>
                  </tr>
                  <tr>
                    <td colspan="2" class="form-check form-switch">
                      <label for="dark-mode" class="form-check-label form-label"
                        >Dark Mode</label
                      >
                      <input
                        id="dark-mode"
                        name="dark-mode"
                        type="button"
                        class="form-check-input"
                      />
                    </td>
                  </tr>
                  <tr>
                    <td>
                      <button type="button" class="btn btn-success w-100">
                        Save
                      </button>
                    </td>
                    <td>
                      <button type="button" class="btn btn-danger w-100">
                        Reset
                      </button>
                    </td>
                  </tr>
                </tbody>
              </table>
            </div>
          </div>
        </div>
      </div>
    </div>

    <script src="Source Files/settings.js"></script>
